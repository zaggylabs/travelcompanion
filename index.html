<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TravelCompanion – trip itinerary and budget planner</title>
  <meta name="description" content="Plan your trip day by day and keep your travel budget on track. A friendlier alternative to a spreadsheet. Free, no sign-up, and your trips stay on your device.">
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
  <script src="/assets/js/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,600..700,100&family=Nunito:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="/assets/css/style.css">
  <meta property="og:type" content="website">
  <meta property="og:title" content="TravelCompanion – trip itinerary and budget planner">
  <meta property="og:description" content="Plan your trip day by day and keep your travel budget on track. A friendlier alternative to a spreadsheet.">
</head>
<body>
  <header class="site-head">
    <div class="wrap">
      <a class="brand" href="/"><img src="/assets/icon.svg" alt="" width="28" height="28">TravelCompanion</a>
      <span class="small muted">Your trips stay cosy on this device</span>
      <button type="button" class="btn home-btn" id="home-btn" hidden></button>
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch colour mode" hidden>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <main class="wrap" id="app">
    <noscript><p>TravelCompanion needs JavaScript turned on.</p></noscript>
  </main>

  <footer class="site-foot wrap small muted">
    Made for slow mornings and big adventures ☕ Your trips are saved on this device only, so use <strong>Export CSV</strong> on a trip to keep a backup.
    <span class="credits">Map and place data © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap contributors</a>. Place summaries from <a href="https://www.wikipedia.org/" target="_blank" rel="noopener">Wikipedia</a> (CC BY-SA).</span>
  </footer>

  <script type="module" src="/assets/js/app.js"></script>
</body>
</html>
